---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: push-to-cspv2
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton Pipeline used as an initial setup for push-to-cspv2: downloads a test
    OCI artifact from Quay and verifies its checksum against the artifact's manifest.
  params:
    - name: taskGitUrl
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
      type: string
    - name: taskGitRevision
      description: The revision in the taskGitUrl repo to be used
      type: string
  tasks:
    - name: push-to-cspv2-task
      timeout: "10m0s"
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/push-to-cspv2-task/push-to-cspv2-task.yaml
      params: []
  results:
    - name: result
      value: $(tasks.push-to-cspv2-task.results.result)
    - name: expectedChecksum
      value: $(tasks.push-to-cspv2-task.results.expectedChecksum)
    - name: actualChecksum
      value: $(tasks.push-to-cspv2-task.results.actualChecksum)
