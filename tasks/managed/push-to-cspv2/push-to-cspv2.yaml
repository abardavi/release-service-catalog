---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-to-cspv2
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that creates an InternalRequest to check connectivity
    to CSPv2 (Unified Downloads).
  params:
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: requestTimeout
      type: string
      default: "1800"
      description: InternalRequest timeout
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: ud2CertificateSecret
      type: string
      description: Secret containing the ud2 client certificate
      default: cspv2-stage-crt
    - name: ud2KeySecret
      type: string
      description: Secret containing the ud2 client key
      default: cspv2-crt-key
  results:
    - name: pushResult
      description: Result of the operation (pass/fail)
  volumes:
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
    - name: ud2-certificate
      secret:
        secretName: $(params.ud2CertificateSecret)
        defaultMode: 0444
    - name: ud2-key
      secret:
        secretName: $(params.ud2KeySecret)
        defaultMode: 0444
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
      - name: ud2-certificate
        mountPath: /mnt/ud2-secrets/certificate
        subPath: certificate
        readOnly: true
      - name: ud2-key
        mountPath: /mnt/ud2-secrets/key
        subPath: key
        readOnly: true
  steps:
    # TEMPORARY: connectivity check inlined here (bypassing the InternalRequest) because
    # the rhtap-releng-tenant namespace is not yet in the internal-request allow list.
    # Revert to the run-internal-request step below once that's resolved.
    - name: run-internal-request
      image: quay.io/abardavi/release-service-utils@sha256:f75d0aeb40745f7c2cae9d08471848b2916f646115fa48696609d4290e386c0c
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 50m
      script: |
        #!/usr/bin/env bash
        set -eo pipefail

        connectivity='{}'

        timeout 3 bash -c 'echo > /dev/tcp/unified-downloads-api.stage.rhsm.redhat.com/80' ; rc=$?
        echo "stage 80 result: ${rc}"
        connectivity=$(jq -c --argjson rc "${rc}" '."stage-80" = $rc' <<< "${connectivity}")

        timeout 3 bash -c 'echo > /dev/tcp/unified-downloads-api.stage.rhsm.redhat.com/443' ; rc=$?
        echo "stage 443 result: ${rc}"
        connectivity=$(jq -c --argjson rc "${rc}" '."stage-443" = $rc' <<< "${connectivity}")

        timeout 3 bash -c 'echo > /dev/tcp/unified-downloads-api.rhsm.redhat.com/80' ; rc=$?
        echo "prod 80 result: ${rc}"
        connectivity=$(jq -c --argjson rc "${rc}" '."prod-80" = $rc' <<< "${connectivity}")

        timeout 3 bash -c 'echo > /dev/tcp/unified-downloads-api.rhsm.redhat.com/443' ; rc=$?
        echo "prod 443 result: ${rc}"
        connectivity=$(jq -c --argjson rc "${rc}" '."prod-443" = $rc' <<< "${connectivity}")

        echo "Connectivity results: ${connectivity}"

        SEARCH_OUTPUT_FILE=$(mktemp)
        trap 'rm -f "${SEARCH_OUTPUT_FILE}"' EXIT

        if ud2 --config /home/ud2/config.ini product search --name quarkus > "${SEARCH_OUTPUT_FILE}" 2>&1; then
          echo "ud2 search output:"
          cat "${SEARCH_OUTPUT_FILE}"
        else
          echo "ud2 search command failed:"
          cat "${SEARCH_OUTPUT_FILE}"
          echo -n "Failed" > "$(results.pushResult.path)"
          exit 1
        fi

        if [[ -s "${SEARCH_OUTPUT_FILE}" ]] && grep -qi "quarkus" "${SEARCH_OUTPUT_FILE}"; then
          echo -n "Success" > "$(results.pushResult.path)"
        else
          echo "ud2 search output did not contain expected results"
          echo -n "Failed" > "$(results.pushResult.path)"
          exit 1
        fi

    # Original InternalRequest-based step, disabled for now (see comment above):
    #
    # - name: run-internal-request
    #   image: quay.io/konflux-ci/release-service-utils
    #     @sha256:17925cd6c631c3828966457099f117c894eb01983b8639920bf82b1a5e1841d0
