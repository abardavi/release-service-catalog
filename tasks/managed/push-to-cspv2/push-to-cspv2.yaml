---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-to-cspv2
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that creates an InternalRequest to run an initial setup for
    push-to-cspv2: downloading a test OCI artifact from Quay and verifying its checksum.
  params:
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: requestTimeout
      type: string
      default: "1800"
      description: InternalRequest timeout
  results:
    - name: pushResult
      description: Result of the operation (pass/fail)
    - name: expectedChecksum
      description: sha256 checksum declared in the artifact's manifest
    - name: actualChecksum
      description: sha256 checksum of the downloaded file
  stepTemplate:
    securityContext:
      runAsUser: 1001
  steps:
    - name: run-internal-request
      image: quay.io/konflux-ci/release-service-utils@sha256:17925cd6c631c3828966457099f117c894eb01983b8639920bf82b1a5e1841d0
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 50m
      script: |
        #!/usr/bin/env bash
        set -eo pipefail

        TASK_LABEL="internal-services.appstudio.openshift.io/group-id"
        TASK_ID=$(context.taskRun.uid)
        PIPELINERUN_LABEL="internal-services.appstudio.openshift.io/pipelinerun-uid"

        IR_RESULT_FILE=$(mktemp)
        trap 'rm -f "${IR_RESULT_FILE}"' EXIT

        internal-request --pipeline "push-to-cspv2" \
            -p taskGitUrl="$(params.taskGitUrl)" \
            -p taskGitRevision="$(params.taskGitRevision)" \
            -l ${TASK_LABEL}="${TASK_ID}" \
            -l ${PIPELINERUN_LABEL}="$(params.pipelineRunUid)" \
            -t "$(params.requestTimeout)" \
            --pipeline-timeout 0h30m0s \
            --task-timeout 0h20m0s \
            --finally-timeout 0h10m0s \
            -s true \
            | tee "${IR_RESULT_FILE}" || \
            (grep "^\[" "${IR_RESULT_FILE}" | jq . && exit 1)

        internalRequest=$(awk -F"'" '/created/ { print $2 }' "${IR_RESULT_FILE}")
        echo "done (${internalRequest})"

        results=$(kubectl get internalrequest "${internalRequest}" -o=jsonpath='{.status.results}')
        pushResult=$(echo "${results}" | jq -r '.result')
        expectedChecksum=$(echo "${results}" | jq -r '.expectedChecksum')
        actualChecksum=$(echo "${results}" | jq -r '.actualChecksum')
        echo "Push result: ${pushResult}"
        echo "Expected checksum: ${expectedChecksum}"
        echo "Actual checksum:   ${actualChecksum}"
        echo -n "${pushResult}" > "$(results.pushResult.path)"
        echo -n "${expectedChecksum}" > "$(results.expectedChecksum.path)"
        echo -n "${actualChecksum}" > "$(results.actualChecksum.path)"
